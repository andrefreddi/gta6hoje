<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1350px;background:#0d0a12;font-family:"Segoe UI","Noto Sans",Arial,sans-serif,"Segoe UI Emoji","Noto Color Emoji";overflow:hidden}
  .card{position:absolute;inset:50px;background:#fff;color:#0f1419;border-radius:28px;padding:44px;box-sizing:border-box;display:flex;flex-direction:column}
  .head{display:flex;align-items:center;gap:20px}
  .av{width:92px;height:92px;border-radius:50%;background:url(AVATAR) center/cover;flex:none}
  .nm{font-weight:800;font-size:36px}.hd{color:#536471;font-size:28px}
  .tx{font-size:44px;line-height:1.26;margin:30px 0;font-weight:500}
  .img{flex:1;border-radius:22px;background:url(IMAGEM) center/cover}
</style></head>
<body><div class="card">
  <div class="head"><div class="av"></div><div><div class="nm">GTA 6 Hoje</div><div class="hd">@gta6.hoje</div></div></div>
  <div class="tx">{{TEXTO}}</div>
  <div class="img"></div>
</div></body></html>
