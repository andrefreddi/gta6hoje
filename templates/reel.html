<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:"Segoe UI","Noto Sans",Arial,sans-serif,"Segoe UI Emoji","Noto Color Emoji";overflow:hidden}
  .top{position:absolute;left:0;right:0;top:0;height:600px;background:#0d0a12;display:flex;flex-direction:column;justify-content:flex-end;padding:0 70px 50px;box-sizing:border-box}
  .head{display:flex;align-items:center;gap:20px;margin-bottom:34px}
  .av{width:84px;height:84px;border-radius:50%;background:url(AVATAR) center/cover}
  .nm{color:#fff;font-weight:800;font-size:36px}.hd{color:#9aa0a6;font-size:28px}
  .tx{color:#fff;font-size:54px;line-height:1.22;font-weight:700}
  .bot{position:absolute;left:0;right:0;top:1540px;bottom:0;background:#0d0a12;display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
  .tag{color:#fff;font-size:38px;font-weight:700;background:linear-gradient(90deg,#ff2e88,#7a1fff);padding:14px 36px;border-radius:999px}
</style></head>
<body>
  <div class="top"><div class="head"><div class="av"></div><div><div class="nm">GTA 6 Hoje</div><div class="hd">@gta6.hoje</div></div></div>
    <div class="tx">{{TEXTO}}</div></div>
  <div class="bot"><div class="tag">Siga @gta6.hoje</div></div>
</body></html>
