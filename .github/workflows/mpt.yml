name: mpt
# MoneyPrinterTurbo na nuvem: roteiro proprio + clipes do trailer (ou imagens oficiais) + narracao PT + legenda + musica animada.
on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: 'arquivo de roteiro em conteudo/'
        required: false
        default: 'mpt_teoria.txt'
      saida:
        description: 'nome do video gerado (sem extensao)'
        required: false
        default: 'teoria01'
      clipes:
        description: 'clipes do release em ordem (ex: c02,c17,c25). Vazio = imagens oficiais'
        required: false
        default: ''
      duracao:
        description: 'duracao maxima de cada clipe (s)'
        required: false
        default: '5'
      voz:
        description: 'voz edge (formato MPT: nome-Genero)'
        required: false
        default: 'fr-FR-RemyMultilingualNeural-Male'
      gancho:
        description: 'texto grande nos 3 primeiros segundos (vazio = sem)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  mpt:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core >/dev/null
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-mpt-v1
      - name: Instalar MoneyPrinterTurbo
        run: |
          git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git mpt
          cd mpt
          pip install -q -r requirements.txt
          pip install -q librosa
          cp config.example.toml config.toml
      - name: Materiais
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mats
          if [ -n "${{ inputs.clipes }}" ]; then
            # formato: c14@34-40,c20@38-44  (clipe@inicio-fim em segundos)
            # recorta so a faixa central (tira marca OpusClip do topo e legenda queimada de baixo)
            # e remonta 9:16 com fundo desfocado
            mkdir -p src
            MATS=""; n=0
            for item in $(echo "${{ inputs.clipes }}" | tr ',' ' '); do
              c="${item%@*}"; r="${item#*@}"; a="${r%-*}"; b="${r#*-}"
              [ -f "src/$c.mp4" ] || gh release download clipes-trailer --repo ${{ github.repository }} --dir src --pattern "$c.mp4"
              n=$((n+1)); o="$GITHUB_WORKSPACE/mats/s$(printf %02d $n).mp4"
              ffmpeg -loglevel error -y -ss "$a" -to "$b" -i "src/$c.mp4" -an \
                -vf "crop=iw:ih*0.29:0:ih*0.36,split[x][y];[x]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=25[bg];[y]scale=-2:900,crop=1080:900[fg];[bg][fg]overlay=0:(H-h)/2,fps=30,format=yuv420p" \
                -c:v libx264 -crf 18 "$o"
              MATS="$MATS,$o"
            done
            ffmpeg -loglevel error -y -i "$GITHUB_WORKSPACE/mats/s01.mp4" -frames:v 1 -vf scale=270:-2 "$GITHUB_WORKSPACE/mats/preview_s01.jpg" || true
            echo "MATS=${MATS#,}" >> "$GITHUB_ENV"
            echo "CONCAT=sequential" >> "$GITHUB_ENV"
          else
            MATS=$(ls "$GITHUB_WORKSPACE"/fontes/*.jpg | grep -E '/(featured|launch-trailer|onlyInLeonida|poster_full|screenshotsDesktop|ULTIMATE_EDITION|VINTAGE_VICE_CITY|GTAVI_FOB)' | paste -sd, -)
            echo "MATS=$MATS" >> "$GITHUB_ENV"
            echo "CONCAT=random" >> "$GITHUB_ENV"
          fi
      - name: Escolher musica mais animada
        run: |
          cd mpt
          python - <<'EOF'
          import glob, os, librosa, numpy as np
          res = []
          for f in sorted(glob.glob("resource/songs/*.mp3")):
              try:
                  y, sr = librosa.load(f, sr=22050, duration=60)
                  tempo = float(np.atleast_1d(librosa.beat.beat_track(y=y, sr=sr)[0])[0])
                  rms = float(np.mean(librosa.feature.rms(y=y)))
                  bright = float(np.mean(librosa.feature.spectral_centroid(y=y, sr=sr)))
                  res.append((f, tempo, rms, bright))
              except Exception as e:
                  print("erro", f, e)
          t = np.array([r[1] for r in res]); r_ = np.array([r[2] for r in res]); b = np.array([r[3] for r in res])
          z = lambda a: (a - a.mean()) / (a.std() + 1e-9)
          score = z(t) + z(r_) + z(b)
          order = np.argsort(-score)
          for i in order[:8]:
              print(f"{os.path.basename(res[i][0])} bpm={res[i][1]:.0f} rms={res[i][2]:.3f} brilho={res[i][3]:.0f} score={score[i]:.2f}")
          best = res[order[0]][0]
          open(os.environ["GITHUB_ENV"], "a").write(f"BGM={os.path.abspath(best)}\n")
          EOF
      - name: Gerar video
        run: |
          cd mpt
          TID=$(python -c "import uuid; print(uuid.uuid4())")
          echo "musica: $BGM"
          python cli.py \
            --task-id "$TID" \
            --video-subject "Teorias de GTA 6" \
            --video-script "$(cat "$GITHUB_WORKSPACE/conteudo/${{ inputs.roteiro }}")" \
            --video-language pt-BR \
            --video-source local \
            --video-materials "$MATS" \
            --video-concat-mode "$CONCAT" \
            --image-motion zoom \
            --video-transition-mode none \
            --video-clip-duration ${{ inputs.duracao }} \
            --video-aspect 9:16 \
            --video-fit-mode cover \
            --voice-name "${{ inputs.voz }}" \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --bgm-file "$BGM" \
            --bgm-volume 0.25 \
            --font-size 80 \
            --stroke-color "#000000" \
            --stroke-width 4 \
            --subtitle-position bottom \
            --subtitle-enabled
          OUT=$(find storage/tasks/"$TID" -name 'final-*.mp4' | head -1)
          test -n "$OUT"
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "${{ inputs.gancho }}" ]; then
            # gancho: texto grande no topo nos 3 primeiros segundos (quebra em 2 linhas)
            python3 -c "import textwrap,sys; open('/tmp/gancho.txt','w').write('\n'.join(textwrap.wrap(sys.argv[1], 18)))" "${{ inputs.gancho }}"
            ffmpeg -loglevel error -y -i "$OUT" -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=/tmp/gancho.txt:fontcolor=white:fontsize=78:line_spacing=14:borderw=6:bordercolor=black:box=1:boxcolor=0xff2e88@0.85:boxborderw=28:x=(w-text_w)/2:y=230:enable='lt(t,3.2)'" \
              -c:v libx264 -crf 19 -preset medium -c:a copy -movflags +faststart "$GITHUB_WORKSPACE/out/${{ inputs.saida }}.mp4"
          else
            cp "$OUT" "$GITHUB_WORKSPACE/out/${{ inputs.saida }}.mp4"
          fi
          ffmpeg -loglevel error -y -i "$GITHUB_WORKSPACE/out/${{ inputs.saida }}.mp4" -vf "fps=1/3,scale=180:-2,tile=6x3" -frames:v 1 "$GITHUB_WORKSPACE/out/grade.jpg" || true
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$GITHUB_WORKSPACE/out/${{ inputs.saida }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: mpt
          path: out/
          retention-days: 5
      - name: Guardar video no repo (nao publica)
        run: |
          mkdir -p media/mpt
          cp out/${{ inputs.saida }}.mp4 media/mpt/
          git config user.name "gta6hoje-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/mpt
          git diff --cached --quiet || (git commit -m "mpt: ${{ inputs.saida }}" && git pull --rebase -q && git push)
