name: publica
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'item especifico (ex: clipes2/01); vazio = proximo'
        required: false
concurrency: publica
permissions:
  contents: write
jobs:
  publica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar proximo item
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841447977803511'
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ -n "${{ inputs.id }}" ]; then node scripts/publica.mjs --id "${{ inputs.id }}"; else node scripts/publica.mjs; fi
      - name: Salvar estado da fila
        run: |
          git config user.name "gta6hoje-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fila.json
          git diff --cached --quiet || (git commit -m "publicado: $(date -u +%FT%TZ)" && git push)