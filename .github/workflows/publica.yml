name: publica
on:
  schedule:
    # cadência acelerada até o lançamento: de 2 em 2h, 9h–23h BRT (UTC-3) = 12,14,16,18,20,22,00,02 UTC
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 18 * * *'
    - cron: '0 20 * * *'
    - cron: '0 22 * * *'
    - cron: '0 0 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'item específico (ex: lote02/03); vazio = próximo da fila'
        required: false
concurrency: publica
permissions:
  contents: write
jobs:
  publica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publicar próximo item
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841447977803511'
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ -n "${{ inputs.id }}" ]; then node scripts/publica.mjs --id "${{ inputs.id }}"; else node scripts/publica.mjs; fi
      - name: Salvar estado da fila
        run: |
          git config user.name "gta6hoje-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fila.json
          git diff --cached --quiet || (git commit -m "publicado: $(date -u +%FT%TZ)" && git push)
