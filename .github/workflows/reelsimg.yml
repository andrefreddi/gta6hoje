name: reelsimg
# Transforma imagens em reels narrados (imagem inteira + fundo desfocado + narracao).
on:
  push:
    paths: ['conteudo/imgvid*.json']
  workflow_dispatch:
    inputs:
      nome:
        description: 'arquivo de conteudo (ex: imgvid01)'
        required: false
        default: 'imgvid01'
concurrency: fila
permissions:
  contents: write
jobs:
  reelsimg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q edge-tts
      - name: Gerar
        run: python scripts/reels_imagem.py ${{ inputs.nome || 'imgvid01' }}
      - name: Commit
        run: |
          git config user.name "gta6hoje-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf _work_img
          git add media fila.json
          git diff --cached --quiet || (git commit -m "reels de imagem: $(date -u +%FT%TZ)" && git push)
